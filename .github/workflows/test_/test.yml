name: Automated Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Arniston_Letting.slnx

      - name: Build
        run: dotnet build Arniston_Letting.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Arniston_Letting.slnx --configuration Release --no-build
